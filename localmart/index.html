<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Univault Local Mart</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header class="header">
        <h1>Univault Local Mart</h1>
        <p>Discover nearby shops & products</p>
    </header>

    <div class="container">
        <!-- Control Bar -->
        <div class="control-bar">
            <!-- Radius Filter -->
            <select id="radiusFilter">
                <option value="1">Radius: 1 km</option>
                <option value="3">Radius: 3 km</option>
                <option value="5" selected>Radius: 5 km</option>
                <option value="10">Radius: 10 km</option>
                <option value="999">Radius: Anywhere</option>
            </select>

            <!-- Type Filter -->
            <select id="typeFilter">
                <option value="all">All Shop Types</option>
                <option value="grocery">Grocery</option>
                <option value="vegetables">Vegetables</option>
                <option value="electronics">Electronics</option>
                <option value="supermarket">Supermarket</option>
                <option value="pharmacy">Pharmacy</option>
                <option value="bakery">Bakery</option>
                <option value="hardware">Hardware</option>
            </select>

            <button id="btnLocation">📍 My Location</button>
        </div>

        <div class="main-content">
            <!-- Leaflet Map -->
            <div id="map"></div>

            <!-- Shop List Sidebar -->
            <div class="sidebar">
                <h2>Nearest Shops</h2>
                <div id="shopList"></div>
            </div>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="map.js"></script>
</body>
</html>
